<!--
  The tab icon (manual §2, "the favicon is the same bus, drawn as a plain dark outline with no
  background tile, legible at 16 px"). Same path data as Bus.tsx, on the same 16x16 grid — the
  "one bus drawing" reused a second place, not redrawn. The silhouette here is byte-for-byte the
  same `d` attribute as Bus.tsx's <path> and the same two wheel circles; only the colour behaviour
  differs, for the reason below.

  This is a standalone SVG document loaded directly by the browser via <link rel="icon">, so it
  has no host page to inherit `currentColor` from the way Bus.tsx does everywhere else it's
  placed. It carries its own <style> instead.

  Why this file alone gets a dark variant even though the game is light-mode-only (studio/GAME.md,
  "Light mode only", 2026-08-12): that decision governs the app's *own* chrome, which the game
  controls and intentionally keeps on the paper palette. A favicon sits in the *browser's* tab
  bar, whose colour is set by the OS/browser theme — something the game has no influence over and
  a large share of players run dark. A pure black outline (the light-tab design) nearly disappears
  on a dark tab. So this document restyles its own strokes under
  `@media (prefers-color-scheme: dark)`, scoped to this SVG only — it does not opt the app back
  into following the system theme, and does not touch index.html or styles.css.

  This keeps the manual's "no background tile" intent: the canvas stays transparent in both cases,
  the outline itself just inverts from dark-on-transparent to light-on-transparent depending on
  the tab bar it sits on. Default (no media match, or a renderer that ignores <style> in SVG
  favicons) falls back to the original plain black outline — i.e. today's behaviour — so this is
  additive, not a regression for anything that doesn't support the media query.

  The light-mode stroke stays the `black` keyword the manual calls for. The dark-mode stroke reuses
  the "paper" token (#f6f1e1) from the app's existing palette (studio/GAME.md, "Art direction")
  rather than inventing a new colour — this document can't reference the app's CSS custom
  properties (it's a separate document with no shared stylesheet), so the hex is inlined here, but
  it's the same value, not a new one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    .bus-stroke { stroke: black; }
    .bus-fill { fill: black; }
    @media (prefers-color-scheme: dark) {
      .bus-stroke { stroke: #f6f1e1; }
      .bus-fill { fill: #f6f1e1; }
    }
  </style>
  <path
    class="bus-stroke"
    d="M2.3 9.5 L2.3 4.7 L11.1 4.7 L13.5 7.2 L13.5 9.5 Z"
    fill="none"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle class="bus-fill" cx="4.8" cy="10.8" r="1.3" />
  <circle class="bus-fill" cx="11.3" cy="10.8" r="1.3" />
</svg>
